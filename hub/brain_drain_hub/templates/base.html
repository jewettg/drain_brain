<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}brain_drain_hub{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2430; --muted:#6b7480; --line:#dfe3e8; --accent:#2563eb;
          --ok:#1a8f4c; --warn:#d98200; --alarm:#d6291f; --off:#9aa1ab; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:.6rem 1rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
  header a { color:var(--ink); text-decoration:none; font-weight:600; }
  header .brand { color:var(--accent); }
  main { max-width:1100px; margin:0 auto; padding:1rem; }
  .badge { background:var(--alarm); color:#fff; border-radius:999px; padding:0 .5rem; font-size:.8rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:.8rem; }
  .card { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--ok); border-radius:8px; padding:.8rem; color:inherit; text-decoration:none; display:block; }
  .card.warn { border-left-color:var(--warn); background:#fff8ec; }
  .card.alarm { border-left-color:var(--alarm); background:#fdeceb; }
  .card.offline { border-left-color:var(--off); background:#eef0f2; color:var(--muted); }
  .card h3 { margin:0 0 .4rem; }
  .row { display:flex; justify-content:space-between; font-size:.9rem; }
  .gauge { height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin:.3rem 0; }
  .gauge > div { height:100%; background:var(--accent); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; margin-bottom:1rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:.35rem .4rem; border-bottom:1px solid var(--line); }
  input, textarea, button { font:inherit; padding:.45rem .6rem; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  textarea { width:100%; font-family:ui-monospace, monospace; font-size:.85rem; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.secondary { background:#fff; color:var(--accent); }
  button.danger { background:var(--alarm); border-color:var(--alarm); }
  form.inline { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .msg-ok { color:var(--ok); } .msg-err { color:var(--alarm); }
  .muted { color:var(--muted); }
  .pill { display:inline-block; padding:0 .5rem; border-radius:999px; font-size:.8rem; background:var(--line); }
  .pill.alarm { background:var(--alarm); color:#fff; } .pill.warn { background:var(--warn); color:#fff; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">brain_drain_hub</a>
  <a href="/">Fleet</a>
  <a href="/alerts">Alerts {% if nav_alerts %}<span class="badge">{{ nav_alerts }}</span>{% endif %}</a>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
