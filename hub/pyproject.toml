[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain_drain_hub"
version = "0.1.0"
description = "Fleet controller for drain_brain devices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "jinja2>=3.1",
  "cryptography>=43",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["brain_drain_hub*"]

[tool.setuptools.package-data]
brain_drain_hub = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
